<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Letter Pair Trainer{% endblock %}</title>
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem("letterPairTheme") || "light";
        } catch (error) {
            document.documentElement.dataset.theme = "light";
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page-{{ active_page|default('app') }}">

<nav class="navbar">
    <a class="brand" href="/">Letter Pair Trainer</a>

    <div class="nav-links" aria-label="Primary navigation">
        <a class="{% if active_page == 'practice' %}active{% endif %}" href="/">Practice</a>
        <a class="{% if active_page == 'memo' %}active{% endif %}" href="/memo">Memo Practice</a>
        <a class="{% if active_page == 'browse' %}active{% endif %}" href="/browse">Heatmap</a>
        <a class="{% if active_page == 'words' %}active{% endif %}" href="/words">Database</a>
        <button class="theme-toggle" type="button" data-theme-toggle>Dark</button>
    </div>
</nav>

<main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <section class="flash-stack" aria-live="polite">
                {% for category, message in messages %}
                    <div class="flash-message flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            </section>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
